<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Degradado Fuego -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="50%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FFEA00" />
    </linearGradient>
  </defs>

  <style>
    .subtext { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 20px; fill: #D1C7BD; letter-spacing: 10px; font-weight: 600; text-anchor: middle; }
    .catedral { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 68px; fill: #FDFBF7; font-weight: 700; letter-spacing: 2px; }
    .fuego { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 68px; fill: #FF6D00; font-weight: 700; letter-spacing: 2px; }
    .de { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 32px; fill: #FF6D00; font-weight: 600; }
  </style>

  <!-- Texto Superior -->
  <text x="400" y="70" class="subtext">MINISTERIO</text>

  <!-- Llama de Fuego Central -->
  <g transform="translate(378, 80) scale(1.3)">
    <path d="M 12,50 C 5,35 10,20 20,5 C 22,25 32,20 30,0 C 45,15 48,35 38,50 C 48,35 45,15 35,10 C 25,35 15,35 12,50 Z" fill="url(#flameGrad)" />
  </g>

  <!-- Texto Principal -->
  <g transform="translate(40, 190)">
    <!-- CATEDRAL -->
    <text x="0" y="0" class="catedral">CATEDRAL</text>
    
    <!-- DE (En tamaño pequeño/subíndice) -->
    <text x="380" y="10" class="de">DE</text>
    
    <!-- FUEGO -->
    <text x="430" y="0" class="fuego">FUEGO</text>
  </g>
</svg>
